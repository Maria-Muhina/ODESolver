name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-ci --target ODESolverTests
      - name: Test
        run: ctest --test-dir build-ci -R '^(EulerSolverTest|RK4SolverTest|RK4StepTest|AdaptiveRK4SolverTest)\.' --output-on-failure
